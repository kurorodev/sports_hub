spring:
  application:
    name: sport-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sport}
    username: ${DB_USER:sport}
    password: ${DB_PASSWORD:sport_local}
    hikari:
      maximum-pool-size: 15
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    serialization:
      write-dates-as-timestamps: false
server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 2h
      cookie:
        name: SPORT_SESSION
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.show-details: never
app:
  geoapify-api-key: ${GEOAPIFY_API_KEY:}
  demo-enabled: ${DEMO_ENABLED:false}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
