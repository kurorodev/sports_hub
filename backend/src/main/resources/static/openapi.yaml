      tags:
      - Map
      operationId: getMapEvents
      summary: Мероприятия в окне карты
      description: Только PUBLISHED с обеими координатами, startsAt >= now и from.
        Сортировка startsAt ASC, id ASC. truncated требует приближения карты.
      x-phase: P2
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapEventsResponse'
        '400':
          $ref: '#/components/responses/400'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
      parameters:
      - name: bbox
        in: query
        required: true
        schema:
          type: string
