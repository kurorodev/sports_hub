openapi: 3.0.3
info:
  title: ДВИЖ — Sport Hub REST API
  version: 1.0.0-draft
  description: Контракт frontend ↔ Java Spring Boot для конкурсного прототипа. P0 = обязательные сценарии, P1 = рекомендательные/сбор
    команды, P2 = расширения профиля/рейтинга/сообщений. x-phase на каждом методе. Проектные решения команды, не часть
    официального задания.
servers:
- url: http://localhost:8080/api/v1
  description: Локальный Java backend
- url: /api/v1
  description: Относительный путь для reverse proxy или production
tags:
- name: Demo
- name: Health
- name: Catalog
- name: Profiles
- name: Events
- name: Registrations
- name: Comments
- name: Organizations
- name: Administration
- name: Recommendations
- name: Team Builder
- name: Ratings
- name: Messaging
- name: Geo
- name: Map
security:
- cookieAuth: []
paths:
  /health:
    get:
      tags:
      - Health
      summary: Проверка готовности
      operationId: getHealth
      description: ''
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          $ref: '#/components/responses/500'
      security: []
      x-phase: P0
  /demo/accounts:
    get:
      tags:
      - Demo
      summary: Доступные тестовые аккаунты
      operationId: getDemoAccounts
      description: ''
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DemoAccount'
        '500':
          $ref: '#/components/responses/500'
      security: []
      x-phase: P0
  /demo/session:
    post:
      tags:
      - Demo
      summary: Создать или переключить демосессию
      operationId: postDemoSession
      description: Инвалидировать предыдущую сессию, создать новую и выдать новый CSRF токен. Не принимать роль или
        userId из других полей.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          headers:
            Set-Cookie:
              description: Новый HttpOnly cookie SPORT_SESSION
              schema:
                type: string
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoLoginRequest'
      security: []
      x-phase: P0
    delete:
      tags:
      - Demo
      summary: Выйти из демосессии
      operationId: deleteDemoSession
      description: ''
      responses:
        '204':
          description: Сессия удалена
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'
      x-phase: P0
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        description: Токен из Session.csrfToken
        schema:
          type: string
  /session:
    get:
      tags:
      - Demo
      summary: Получить текущую сессию
      operationId: getSession
      description: ''
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
      x-phase: P0
  /sports:
    get:
      tags:
      - Catalog
      summary: Справочник видов спорта
      operationId: getSports
      description: ''
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sport'
        '500':
          $ref: '#/components/responses/500'
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: Поиск по названию спорта (без учета регистра)
      security: []
      x-phase: P0
  /me/profile:
    get:
      tags:
      - Profiles
      summary: Профиль текущего пользователя
      operationId: getMeProfile
      description: ''
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
      x-phase: P1
    patch:
      tags:
      - Profiles
      summary: Обновить свой профиль
      operationId: patchMeProfile
      description: ratingPoints/rank/системные роли редактировать нельзя.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatch'
      x-phase: P1
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        description: Токен из Session.csrfToken
        schema:
          type: string
  /users/{userId}:
    get:
      tags:
      - Profiles
      summary: Публичный профиль пользователя
      operationId: getUsersUserid
      description: ''
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      parameters:
      - &id001
        name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security: []
      x-phase: P1
  /users/{userId}/rating:
    get:
      tags:
      - Ratings
      summary: Рейтинг и ранг пользователя
      operationId: getUsersUseridRating
      description: ''
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rating'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      parameters:
      - *id001
      security: []
      x-phase: P2
  /users/{userId}/rating-history:
    get:
      tags:
      - Ratings
      summary: История начислений
      operationId: getUsersUseridRatingHistory
      description: ''
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedRatingLedger'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      parameters:
      - *id001
      - &id002
        name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - &id003
        name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      security: []
      x-phase: P2
  /events:
    get:
      tags:
      - Events
      summary: Каталог опубликованных мероприятий
      operationId: getEvents
      description: 'Обычному пользователю выдаются только PUBLISHED; при includePast=false исключаются мероприятия
        с startsAt < now(). Сортировка стабильна: вторичный ключ id ASC. Все фильтры применяются через AND.'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedEvents'
        '400':
          $ref: '#/components/responses/400'
        '500':
          $ref: '#/components/responses/500'
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: Подстрока в названии, описании или спорте; без учета регистра
      - name: sportId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: sport
        in: query
        required: false
        schema:
          type: string
        description: Название вида спорта, в т.ч. пользовательского
      - name: city
        in: query
        required: false
        schema:
          type: string
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: startsAt >= from (временная метка с часовым поясом)
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: startsAt <= to (временная метка с часовым поясом)
      - name: skillLevel
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/EventSkillLevel'
      - name: joinMode
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/JoinMode'
      - name: eventKind
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/EventKind'
      - name: organizerType
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/OrganizerType'
      - name: hasSpots
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: Только с незанятыми местами; безлимитные включаются
      - name: includePast
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: По умолчанию показываются предстоящие события
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - startsAt,asc
          - startsAt,desc
          - createdAt,desc
          default: startsAt,asc
      - *id002
      - *id003
      security: []
      x-phase: P0
    post:
      tags:
      - Events
      summary: Создать мероприятие
      operationId: postEvents
      description: USER вправе создать личное событие; организация — только APPROVED и при наличии полномочий текущего
        пользователя. publishNow по умолчанию true. При customName новый спорт сохраняется в БД без правки кода.
      responses:
        '201':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreate'
      x-phase: P0
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        description: Токен из Session.csrfToken
        schema:
          type: string
  /me/events:
    get:
      tags:
      - Events
      summary: Собственные события и события управляемых организаций
      operationId: getMeEvents
      description: Включая черновики и неопубликованные мероприятия, видимые только организатору.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedEventDetails'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
      parameters:
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/EventStatus'
      - *id002
      - *id003
      x-phase: P0
  /events/recommended:
    get:
      tags:
      - Recommendations
      summary: Мне подходит — рекомендуемые мероприятия
      operationId: getEventsRecommended
      description: 'Только PUBLISHED предстоящие; scoring v1: +50 совпавший любимый спорт, +20 подходящий уровень,
        +20 подходящее время, +10 доступные места. Tie-break startsAt ASC, id ASC. Признаки объясняются в matchReasons.'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedRecommendedEvents'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
      parameters:
      - name: city
        in: query
        required: false
        schema:
          type: string
      - *id002
      - *id003
      x-phase: P1
  /events/{eventId}:
    get:
      tags:
      - Events
      summary: Карточка мероприятия
      operationId: getEventsEventid
      description: PUBLISHED публично. Для UNPUBLISHED/DELETED карточка доступна только автору, администратору и ранее
        записанным (информационный режим; повторная запись запрещена). Иным возвращается 404.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      parameters:
      - &id004
        name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security: []
      x-phase: P0
    patch:
      tags:
      - Events
      summary: Редактировать своё мероприятие
      operationId: patchEventsEventid
      description: ''
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
      parameters:
      - *id004
      - name: X-CSRF-Token
        in: header
        required: true
        description: Токен из Session.csrfToken
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventPatch'
      x-phase: P1
  /events/{eventId}/publish:
    post:
      tags:
      - Events
      summary: Опубликовать черновик
      operationId: postEventsEventidPublish
      description: ''
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
      parameters:
      - *id004
      - name: X-CSRF-Token
        in: header
        required: true
        description: Токен из Session.csrfToken
        schema:
          type: string
      x-phase: P1
  /events/{eventId}/my-registration:
    get:
      tags:
      - Registrations
      summary: Моя запись на событие
      operationId: getEventsEventidMyRegistration
      description: 404, если записи нет.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registration'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      parameters:
      - *id004
      x-phase: P0
  /me/registrations:
    get:
      tags:
      - Registrations
      summary: Мои заявки и участия
      operationId: getMeRegistrations
      description: ''
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedRegistrations'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
      parameters:
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/RegistrationStatus'
      - *id002
      - *id003
      x-phase: P0
  /events/{eventId}/registrations:
    post:
      tags:
      - Registrations
      summary: Присоединиться или отправить заявку
      operationId: postEventsEventidRegistrations
      description: OPEN -> CONFIRMED при наличии свободных мест; APPROVAL -> PENDING (место не резервируется). При
        переполнении OPEN -> 409 EVENT_FULL. Дубли -> 409 ALREADY_REGISTERED.
      responses:
        '201':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registration'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
      parameters:
      - *id004
      - name: X-CSRF-Token
        in: header
        required: true
        description: Токен из Session.csrfToken
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationCreate'
      x-phase: P0
    get:
      tags:
      - Registrations
      summary: Список записей для организатора
      operationId: getEventsEventidRegistrations
      description: Только автор события/уполномоченный представитель организации либо ADMIN для чтения. Заявки организатору;
        администратор НЕ принимает заявки.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedRegistrations'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      parameters:
      - *id004
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/RegistrationStatus'
      - *id002
      - *id003
      x-phase: P0
  /events/{eventId}/participants:
    get:
      tags:
      - Registrations
      summary: Подтверждённые участники
      operationId: getEventsEventidParticipants
      description: Только CONFIRMED. PENDING/REJECTED/WAITLISTED не попадают в список участников.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedUsers'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      parameters:
      - *id004
      - *id002
      - *id003
      security: []
      x-phase: P0
  /events/{eventId}/registrations/{registrationId}/decision:
    post:
      tags:
      - Registrations
      summary: Решить заявку участника
      operationId: postEventsEventidRegistrationsRegistrationidDecision
      description: Только автор события. APPROVAL/PENDING -> CONFIRMED либо REJECTED; при APPROVE проверить лимит
        атомарно.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registration'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
      parameters:
      - *id004
      - &id006
        name: registrationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-CSRF-Token
        in: header
        required: true
        description: Токен из Session.csrfToken
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationDecisionRequest'
      x-phase: P0
  /events/{eventId}/registrations/me:
    delete:
      tags:
      - Registrations
      summary: Отменить собственную запись
      operationId: deleteEventsEventidRegistrationsMe
      description: Статус -> CANCELLED; если OPEN и есть очередь, место автоматически передается первому ожидающему.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registration'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500'
      parameters:
      - *id004
      - name: X-CSRF-Token
        in: header
