  /map/venues:
    get:
      tags:
      - Map
      operationId: getMapVenues
      summary: Площадки в окне карты
      description: Публично. Последние оценки каждого пользователя за 90 минут, верхняя
        медиана. Ровно на границе срока — UNKNOWN. История и авторы не публикуются.
      x-phase: P2
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapVenuesResponse'
        '400':
          $ref: '#/components/responses/400'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
      parameters:
      - name: bbox
        in: query
        required: true
        schema:
          type: string
          example: 49.8,53.0,50.4,53.5
        description: west,south,east,north. Валидные координаты, min < max. Охват
          не более 10° по каждой оси; пересечение 180° не поддерживается.
      - name: sportId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 300
      security: []
    post:
      tags:
      - Map
      operationId: createMapVenue
      summary: Добавить спортивную площадку
      description: Сессия и X-CSRF-Token. Не более 3 площадок/час. Совпадающее нормализованное
        имя ближе 30 м — 409.
      x-phase: P2
      responses:
        '201':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VenueMapItem'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VenueCreate'
  /map/venues/{venueId}/reports:
    post:
      tags:
      - Map
      operationId: reportVenueOccupancy
      summary: Оценить загруженность
      description: Сессия и X-CSRF-Token. Оценка субъективная, peopleCount не определяет
        цвет. Повтор от одного пользователя на площадку раз в 10 минут; 429 + Retry-After.
        Оценка актуальна 90 минут.
      x-phase: P2
      responses:
        '201':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VenueMapItem'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
      parameters:
      - name: venueId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OccupancyReportCreate'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: SPORT_SESSION
      description: HttpOnly серверная демосессия. Для изменяющих запросов (кроме POST /demo/session) передавайте X-CSRF-Token,
        полученный из /session.
  parameters: {}
  responses:
    '400':
      description: Неверные данные запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: VALIDATION_ERROR
            message: Неверные данные запроса
            details: []
            requestId: req-demo-001
    '401':
      description: Сессия отсутствует
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: UNAUTHENTICATED
            message: Сессия отсутствует
            details: []
            requestId: req-demo-001
    '403':
      description: Недостаточно прав
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: FORBIDDEN
            message: Недостаточно прав
            details: []
            requestId: req-demo-001
    '404':
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: NOT_FOUND
            message: Ресурс не найден
            details: []
            requestId: req-demo-001
    '409':
      description: Операция конфликтует с текущим состоянием
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: CONFLICT
            message: Операция конфликтует с текущим состоянием
            details: []
            requestId: req-demo-001
    '422':
      description: Невозможный переход состояния
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: INVALID_STATUS_TRANSITION
            message: Невозможный переход состояния
            details: []
            requestId: req-demo-001
    '429':
      description: Слишком много запросов
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: RATE_LIMITED
            message: Слишком много запросов
            details: []
            requestId: req-demo-001
    '500':
      description: Внутренняя ошибка
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: INTERNAL_ERROR
            message: Внутренняя ошибка
            details: []
            requestId: req-demo-001
    NoContent:
      description: Операция выполнена (без тела)
    '503':
      description: Геокодер временно недоступен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    SystemRole:
