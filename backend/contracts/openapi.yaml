openapi: 3.0.3
info:
  title: Стечение REST API
  version: 1.0.0-draft
  description: Контракт frontend ↔ Java Spring Boot для конкурсного прототипа. P0 = обязательные сценарии, P1 = рекомендательные/сбор
    команды, P2 = расширения профиля/рейтинга/сообщений. x-phase на каждом методе. Проектные решения команды, не часть
    официального задания.
servers:
- url: http://localhost:8080/api/v1
  description: Локальный Java backend
- url: /api/v1
  description: Относительный путь для reverse proxy или production
tags:
- name: Demo
- name: Health
- name: Catalog
- name: Profiles
- name: Events
- name: Registrations
- name: Comments
- name: Organizations
- name: Administration
- name: Recommendations
- name: Team Builder
- name: Ratings
- name: Messaging
- name: Geo
- name: Map
- name: Notifications
- name: Support
security:
- cookieAuth: []
paths:
  /support/tickets/{ticketId}/venue:
    post:
      tags:
      - Support
      operationId: publishSupportVenue
      summary: 'ADMIN: добавить площадку и решить обращение; повтор возвращает ту же
        площадку'
      x-phase: P1
      parameters:
      - name: ticketId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Обращение со ссылкой на созданную площадку
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicket'
        '400':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VenueCreate'
  /support/tickets:
    get:
      tags:
      - Support
      operationId: getMySupportTickets
      description: Личные обращения пользователей. Для ADMIN возвращается 403; администраторы используют очередь GET /admin/support/tickets.
      summary: Свои обращения
      x-phase: P1
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 160
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SupportStatus'
      - name: category
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SupportCategory'
      responses:
        '200':
          description: Свои обращения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicketPage'
        '400':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags:
      - Support
      operationId: createSupportTicket
      description: Создание обращений пользователями, включая жалобы и предложения. ADMIN не может создавать обращения — сервер возвращает 403. Администратор работает с очередью поддержки и отвечает в существующих обращениях.
      summary: Создать обращение; до 10 в час
      x-phase: P1
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Создать обращение; до 10 в час
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicket'
        '400':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportCreate'
  /admin/support/tickets:
    get:
      tags:
      - Support
      operationId: getAdminSupportTickets
      summary: Очередь обращений; только ADMIN
      x-phase: P1
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 160
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SupportStatus'
      - name: category
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SupportCategory'
      responses:
        '200':
          description: Очередь обращений; только ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicketPage'
        '400':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /support/tickets/{ticketId}:
    get:
      tags:
      - Support
      operationId: getSupportTicket
      summary: Обращение автора или администратора
      x-phase: P1
      parameters:
      - name: ticketId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Обращение автора или администратора
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicket'
        '400':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    patch:
      tags:
      - Support
      operationId: updateSupportTicket
      summary: Автор закрывает/открывает повторно; ADMIN меняет статус и приоритет
      x-phase: P1
      parameters:
      - name: ticketId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Автор закрывает/открывает повторно; ADMIN меняет статус и приоритет
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicket'
        '400':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportUpdate'
  /support/tickets/{ticketId}/messages:
    get:
      tags:
      - Support
      operationId: getSupportMessages
      summary: Переписка; новые первыми
      x-phase: P1
      parameters:
      - name: ticketId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Переписка; новые первыми
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportMessagePage'
        '400':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags:
      - Support
      operationId: replySupportTicket
      summary: Ответить в активное обращение
      x-phase: P1
      parameters:
      - name: ticketId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Ответить в активное обращение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportMessage'
        '400':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportReply'
  /me/notifications:
    get:
      tags:
      - Notifications
      operationId: getNotifications
      summary: Личные уведомления за последние 30 дней
      description: Только текущий получатель, включая ADMIN. Новые сверху; непрочитанное считается по всему окну,
        независимо от страницы. asOf — граница для прочтения показанного списка.
      x-phase: P1
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Личная лента
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
  /me/notifications/{notificationId}/read:
    post:
      tags:
      - Notifications
      operationId: readNotification
      summary: Отметить своё уведомление прочитанным
      description: Идемпотентно. Для чужого или старше 30 дней — 404.
      x-phase: P1
      parameters:
      - name: notificationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - &notifications_id001
        name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Уведомление прочитано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
  /me/notifications/read-all:
    post:
      tags:
      - Notifications
      operationId: readAllNotifications
      summary: Прочитать свои уведомления до указанной границы
      description: Уведомления новее through остаются непрочитанными. Будущая граница ограничивается серверным временем.
      x-phase: P1
      parameters:
      - *notifications_id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationsReadRequest'
      responses:
        '204':
          description: Прочитано
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'
  /auth/register:
    post:
      tags:
      - Auth
      operationId: registerAccount
      summary: Создать аккаунт с паролем и войти
      security: []
      description: Работает независимо от DEMO_ENABLED. При успехе заменяет сессию и выдаёт Session/CSRF и HttpOnly-cookie.
        Никнейм принимается с @ или без, регистр не учитывается. Ошибки не заменяют текущую сессию. До 60 auth-запросов
        в минуту на IP экземпляра.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRegistrationRequest'
      responses:
        '201':
          description: Сессия установлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '409':
          $ref: '#/components/responses/409'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
  /auth/login:
    post:
      tags:
      - Auth
      operationId: loginAccount
      summary: Войти по никнейму и паролю
      security: []
      description: Работает независимо от DEMO_ENABLED. При успехе заменяет сессию и выдаёт Session/CSRF и HttpOnly-cookie.
        Никнейм принимается с @ или без, регистр не учитывается. Ошибки не заменяют текущую сессию. До 60 auth-запросов
        в минуту на IP экземпляра.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: Сессия установлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '409':
          $ref: '#/components/responses/409'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
  /auth/session:
    delete:
      tags:
      - Auth
      operationId: logoutAccount
      summary: Завершить текущую сессию (нужен CSRF)
      responses:
        '204':
          description: Сессия завершена
        '403':
          $ref: '#/components/responses/403'
  /users:
    get:
      tags:
      - Profile
      operationId: searchUsers
      summary: Подсказки пользователей по началу никнейма
      security: []
      parameters:
      - name: nicknamePrefix
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 41
        description: С @ или без, латиница/цифры/_/-. До 8 публичных пользователей, сортировка по никнейму.
      responses:
        '200':
          description: Совпадения
          content:
            application/json:
              schema:
                type: array
                maxItems: 8
                items:
                  $ref: '#/components/schemas/PublicUser'
        '400':
          $ref: '#/components/responses/400'
  /health:
    get:
      tags:
      - Health
      summary: Проверка готовности
      operationId: getHealth
      description: ''
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          $ref: '#/components/responses/500'
      security: []
      x-phase: P0
  /demo/accounts:
    get:
      tags:
      - Demo
      summary: Доступные тестовые аккаунты
      operationId: getDemoAccounts
      description: Все доступные демоаккаунты, включая созданные через POST /demo/accounts. Без скрытого ограничения
        в 100 записей. Доступно только при включённом деморежиме; идентификатор accountId стабилен при смене nickname.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DemoAccount'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      security: []
      x-phase: P0
    post:
      tags:
      - Demo
      summary: Зарегистрировать нового демопользователя и войти
      operationId: postDemoAccount
      description: Создаёт отдельного пользователя в БД без пароля, только при DEMO_ENABLED=true. Начальные права
