  /map/events:
    get:
      tags:
      - Map
      operationId: getMapEvents
      summary: Мероприятия в окне карты
      description: Только PUBLISHED с обеими координатами, startsAt >= now и from.
        Сортировка startsAt ASC, id ASC. truncated требует приближения карты.
      x-phase: P2
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapEventsResponse'
        '400':
          $ref: '#/components/responses/400'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
      parameters:
      - name: originLatitude
        in: query
        required: false
        description: Текущая широта пользователя. Передаётся вместе с originLongitude и radiusMeters.
        schema:
          type: number
          format: double
          minimum: -90
          maximum: 90
      - name: originLongitude
        in: query
        required: false
        description: Текущая долгота пользователя; только для фильтра расстояния.
        schema:
          type: number
          format: double
          minimum: -180
          maximum: 180
      - name: radiusMeters
        in: query
        required: false
        description: Расстояние по прямой до точки мероприятия. Все три геопараметра обязательны вместе. Без координат мероприятия исключаются; применяется до пагинации через AND с остальными фильтрами.
        schema:
          type: integer
          enum: [100, 200, 500, 1000, 2000, 3000, 5000]
      - name: bbox
        in: query
        required: true
        schema:
          type: string
          example: 49.8,53.0,50.4,53.5
        description: west,south,east,north. Валидные координаты, min < max. Охват
          не более 10° по каждой оси; пересечение 180° не поддерживается.
      - name: sportId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 300
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      security: []
  /map/venues:
    get:
      tags:
      - Map
      operationId: getMapVenues
      summary: Площадки в окне карты
      description: Публично. Последние оценки каждого пользователя за 90 минут, верхняя
        медиана. Ровно на границе срока — UNKNOWN. История и авторы не публикуются.
      x-phase: P2
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapVenuesResponse'
        '400':
          $ref: '#/components/responses/400'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
      parameters:
      - name: bbox
        in: query
        required: true
        schema:
          type: string
          example: 49.8,53.0,50.4,53.5
        description: west,south,east,north. Валидные координаты, min < max. Охват
          не более 10° по каждой оси; пересечение 180° не поддерживается.
      - name: sportId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 300
      security: []
    post:
      tags:
      - Map
      operationId: createMapVenue
      summary: Добавить спортивную площадку
      description: Сессия и X-CSRF-Token. Не более 3 площадок/час. Совпадающее нормализованное
        имя ближе 30 м — 409.
      x-phase: P2
      responses:
        '201':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VenueMapItem'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VenueCreate'
  /map/venues/{venueId}/reports:
    post:
      tags:
      - Map
      operationId: reportVenueOccupancy
      summary: Оценить загруженность
      description: Сессия и X-CSRF-Token. Оценка субъективная, peopleCount не определяет
        цвет. Повтор от одного пользователя на площадку раз в 10 минут; 429 + Retry-After.
        Оценка актуальна 90 минут.
      x-phase: P2
      responses:
        '201':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VenueMapItem'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
      parameters:
      - name: venueId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OccupancyReportCreate'
  /admin/sports:
    post:
      tags: [Admin]
      summary: Создать категорию вида спорта (только ADMIN).
      operationId: createSportCategory
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SportCategoryCreate'}
      responses:
        '201':
          description: Категория создана.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Sport'}
        '400': {description: Некорректное название или изображение.}
        '403': {description: Требуется ADMIN.}
        '409': {description: Название уже существует.}
  /admin/sports/{sportId}:
    parameters:
    - {name: sportId, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      tags: [Admin]
      summary: Переименовать категорию и заменить фото (только ADMIN).
      operationId: updateSportCategory
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SportCategoryPatch'}
      responses:
        '200':
          description: Категория обновлена; изменения сохраняются вместе.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Sport'}
        '400': {description: Некорректные данные или переименование категории Другое.}
        '403': {description: Требуется ADMIN.}
        '404': {description: Категория не найдена или удалена.}
        '409': {description: Название уже существует, включая удалённые категории.}
    delete:
      tags: [Admin]
      summary: Удалить категорию из выбора, сохранив существующие связи (только ADMIN).
      operationId: deleteSportCategory
      security: [{cookieAuth: []}]
      responses:
        '204': {description: Категория удалена из выбора. Повторное удаление допустимо.}
        '400': {description: Общую категорию Другое нельзя удалить.}
        '403': {description: Требуется ADMIN.}
        '404': {description: Категория не найдена.}
  /admin/sports/{sportId}/image:
    put:
      tags: [Admin]
      summary: Загрузить, заменить или убрать фото категории (только ADMIN).
      operationId: setSportCategoryImage
      security: [{cookieAuth: []}]
      parameters:
      - {name: sportId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SportCategoryImage'}
      responses:
        '200':
          description: Категория обновлена.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Sport'}
        '400': {description: Некорректное изображение.}
        '403': {description: Требуется ADMIN.}
        '404': {description: Категория не найдена.}
  /sports/{sportId}/image:
    get:
      tags: [Sports]
      summary: Публичное изображение категории.
      operationId: getSportCategoryImage
      parameters:
      - {name: sportId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Проверенное изображение PNG или JPEG, до 2 МБ.
          content:
            image/png:
              schema: {type: string, format: binary}
            image/jpeg:
              schema: {type: string, format: binary}
        '404': {description: Фото не задано.}
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: SPORT_SESSION
      description: HttpOnly серверная демосессия. Для изменяющих запросов (кроме POST /demo/session) передавайте X-CSRF-Token,
        полученный из /session.
  parameters: {}
  responses:
    '400':
      description: Неверные данные запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: VALIDATION_ERROR
            message: Неверные данные запроса
            details: []
            requestId: req-demo-001
    '401':
      description: Сессия отсутствует
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: UNAUTHENTICATED
            message: Сессия отсутствует
            details: []
            requestId: req-demo-001
    '403':
      description: Недостаточно прав
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: FORBIDDEN
            message: Недостаточно прав
            details: []
            requestId: req-demo-001
    '404':
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: NOT_FOUND
            message: Ресурс не найден
            details: []
            requestId: req-demo-001
    '409':
      description: Операция конфликтует с текущим состоянием
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: CONFLICT
            message: Операция конфликтует с текущим состоянием
            details: []
            requestId: req-demo-001
    '422':
      description: Невозможный переход состояния
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: INVALID_STATUS_TRANSITION
            message: Невозможный переход состояния
            details: []
            requestId: req-demo-001
    '429':
      description: Слишком много запросов
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: RATE_LIMITED
            message: Слишком много запросов
            details: []
            requestId: req-demo-001
    '500':
      description: Внутренняя ошибка
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: INTERNAL_ERROR
            message: Внутренняя ошибка
            details: []
            requestId: req-demo-001
    NoContent:
      description: Операция выполнена (без тела)
    '503':
      description: Геокодер временно недоступен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    SupportCategory:
      type: string
      enum:
      - HELP
      - BUG
      - IDEA
      - VENUE_SUGGESTION
      - COMMENT_REPORT
    SupportStatus:
      type: string
      enum:
      - OPEN
      - IN_PROGRESS
      - WAITING_USER
      - RESOLVED
      - CLOSED
    SupportPriority:
      type: string
      enum:
      - NORMAL
      - HIGH
      - URGENT
    SupportReportReason:
      type: string
      enum:
      - SPAM
      - ABUSE
      - UNSAFE
      - OTHER
    SupportCreate:
      type: object
      properties:
        category:
          $ref: '#/components/schemas/SupportCategory'
        title:
          type: string
          minLength: 3
          maxLength: 160
        description:
          type: string
          minLength: 10
          maxLength: 5000
        commentId:
          type: string
          format: uuid
        reportReason:
          $ref: '#/components/schemas/SupportReportReason'
        venueCity:
          type: string
          minLength: 1
          maxLength: 120
        venueLatitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          nullable: true
        venueLongitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          nullable: true
        venueAddress:
          type: string
          minLength: 1
          maxLength: 300
      required:
      - category
      - title
      - description
      additionalProperties: false
    SupportUpdate:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/SupportStatus'
        priority:
          $ref: '#/components/schemas/SupportPriority'
      required: []
      minProperties: 1
      additionalProperties: false
    SupportReply:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 5000
      required:
      - text
      additionalProperties: false
    SupportTicket:
      type: object
      properties:
        publishedVenueId:
          type: string
          format: uuid
          nullable: true
        id:
          type: string
          format: uuid
        author:
          $ref: '#/components/schemas/PublicUser'
        assignedTo:
          allOf:
          - $ref: '#/components/schemas/PublicUser'
          nullable: true
        category:
          $ref: '#/components/schemas/SupportCategory'
        status:
          $ref: '#/components/schemas/SupportStatus'
        priority:
          $ref: '#/components/schemas/SupportPriority'
        title:
          type: string
        description:
          type: string
        commentId:
          type: string
          format: uuid
          nullable: true
        eventId:
          type: string
          format: uuid
          nullable: true
        commentText:
          type: string
          nullable: true
        commentAuthor:
          type: string
          nullable: true
        reportReason:
          allOf:
          - $ref: '#/components/schemas/SupportReportReason'
          nullable: true
        venueCity:
          type: string
          nullable: true
        venueLatitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          nullable: true
        venueLongitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          nullable: true
        venueAddress:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - author
      - assignedTo
      - category
      - status
      - priority
      - title
      - description
      - commentId
      - eventId
      - commentText
      - commentAuthor
      - reportReason
      - venueCity
      - venueAddress
      - createdAt
      - updatedAt
    SupportMessage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ticketId:
          type: string
          format: uuid
        author:
