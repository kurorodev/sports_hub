  /geo/suggest:
    get:
      tags:
      - Geo
      operationId: suggestLocations
      summary: Подсказки адресов
      description: Серверный Geoapify. Без ключа или при ошибке поставщика — 503.
        Ручной ввод адреса остаётся доступен.
      x-phase: P2
      responses:
        '200':
          description: Успешный ответ
