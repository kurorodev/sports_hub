<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        const settings = JSON.parse(localStorage.getItem("sport.interface.v1") || "{}");
        const theme = settings?.theme === "dark" || (settings?.theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.documentElement.lang = settings?.locale === "en" ? "en" : "ru";
      } catch { /* Use the default appearance if browser storage is unavailable. */ }
    </script>
    <meta name="theme-color" content="#151419" />
    <link
      rel="icon"
      type="image/png"
      href="/images/brand/stechenie-mark-on-light.png"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/brand/stechenie-mark-on-dark.png"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="apple-touch-icon"
      href="/images/brand/stechenie-mark-on-light.png"
    />
    <meta
      name="description"
      content="__APP_NAME__ — находи компанию для спорта и встречи рядом."
    />
    <title>__APP_NAME__ — спорт начинается с компании</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
